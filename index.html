<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

/* ---------------------------------------------------------------
   Karakterler, zaman çizelgesi
---------------------------------------------------------------- */
const RAMP = '.-=+tcvxzrjfnuoae<>[]{}$#%&80QB';     // koyu → açık
const SCRAMBLE = '!#$%&*+-=?@<>[]{}/\\|~^xzQB80';
const TL = {
  stem: [0.8, 3.0], leafL: [1.8, 2.8], leafR: [2.5, 3.5], sepal: [3.5, 4.2],
  bud: [4.2, 7.0], bloom: [7.0, 12.0], text: 12.0
};
const LETTER_GAP = 0.09, LETTER_SCR = 0.4;
const SIG_START = TL.text + CONFIG.message.length * LETTER_GAP + 0.45;
const END_T = SIG_START + CONFIG.signature.length * 0.08 + 0.35;
const HINT_T = END_T + 3;

const qs = new URLSearchParams(location.search);
const FREEZE = qs.has('t') ? parseFloat(qs.get('t')) : null;

const G = ch => ch.charCodeAt(0) - 32;            // glif indeksi (0 = boş)
const RAMP_G = [...RAMP].map(G);
const GL_PIPE = G('|'), GL_SL = G('/'), GL_BS = G('\\'), GL_DASH = G('-'), GL_US = G('_');
const GL_STAR = G('*'), GL_PLUS = G('+'), GL_DOT = G('.');
const DUST_G = [G('.'), G('-'), G('+')];

const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
const easeIO = x => 0.5 - 0.5 * Math.cos(Math.PI * clamp01(x));
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
const prog = (t, [a, b]) => clamp01((t - a) / (b - a));
function hash3(a, b, c) {
  let h = (a * 374761393 + b * 668265263 + c * 2246822519) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------------------------------------------------------
   Renk tabloları (parlaklık → renk)
---------------------------------------------------------------- */
function makeLUT(stops) {
  const lut = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    const x = i / 255; let k = 0;
    while (k < stops.length - 2 && x > stops[k + 1][0]) k++;
    const [x0, c0] = stops[k], [x1, c1] = stops[k + 1];
    const f = clamp01((x - x0) / (x1 - x0));
    for (let j = 0; j < 3; j++) lut[i * 3 + j] = Math.round(lerp(c0[j], c1[j], f));
  }
  return lut;
}
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const PETAL_LUT = makeLUT([[0, hex('#5c0716')], [0.25, hex('#8b0f24')], [0.5, hex('#d8284a')], [0.7, hex('#ff5a76')], [1, hex('#ffb3c1')]]);
const GREEN_LUT = makeLUT([[0, hex('#13652f')], [0.4, hex('#25a24f')], [0.7, hex('#3ddc6e')], [1, hex('#b2ffc9')]]);
const FLASH = [255, 247, 220];

/* ---------------------------------------------------------------
   three.js kurulum
---------------------------------------------------------------- */
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
} catch (e) {
  document.querySelectorAll('#txt span').forEach(s => s.classList.add('on'));
  throw e;
}
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.autoClear = true;

const LIGHT = new THREE.Vector3(-0.5, 0.62, 0.62).normalize();
const VS = `
attribute float ao;
varying vec3 vN; varying float vAO; varying float vY;
void main(){
  vY = position.y; vAO = ao;
  vN = normalize(normalMatrix * normal);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;
const FS = `
uniform float uId; uniform float uClip; uniform vec3 uL; uniform float uBack;
varying vec3 vN; varying float vAO; varying float vY;
void main(){
  if (vY > uClip) discard;
  vec3 n = normalize(vN);
  float side = 1.0;
  if (!gl_FrontFacing) { n = -n; side = uBack; }
  float d = max(dot(n, uL), 0.0);
  float wrap = max(dot(n, uL) * 0.5 + 0.5, 0.0);
  vec3 h = normalize(uL + vec3(0.0, 0.0, 1.0));
  float s = pow(max(dot(n, h), 0.0), 18.0);
  float lum = vAO * side * (0.05 + 0.62 * d + 0.25 * wrap * wrap) + 0.28 * s * vAO;
  gl_FragColor = vec4(clamp(lum, 0.0, 1.0), uId * 0.25, gl_FragCoord.z, 1.0);
}`;
function makeMat(id, back = 1) {
  return new THREE.ShaderMaterial({
    vertexShader: VS, fragmentShader: FS, side: THREE.DoubleSide,
    uniforms: { uId: { value: id }, uClip: { value: 1e9 }, uL: { value: LIGHT }, uBack: { value: back } }
  });
}
function addAO(g, v = 1) {
  const n = g.attributes.position.count;
  g.setAttribute('ao', new THREE.BufferAttribute(new Float32Array(n).fill(v), 1));
  return g;
}
function gridGeometry(nu, nv, count) {
  const vpp = (nu + 1) * (nv + 1);
  const g = new THREE.BufferGeometry();
  const pos = new THREE.BufferAttribute(new Float32Array(count * vpp * 3), 3);
  pos.setUsage(THREE.DynamicDrawUsage);
  g.setAttribute('position', pos);
  g.setAttribute('ao', new THREE.BufferAttribute(new Float32Array(count * vpp).fill(1), 1));
  const idx = [];
  for (let p = 0; p < count; p++) for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
    const a = p * vpp + i * (nv + 1) + j, b = a + nv + 1, c = a + 1, d = b + 1;
    idx.push(a, b, c, c, b, d);
  }
  g.setIndex(idx);
  return g;
}

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(0, 1, 1, 0, 0.1, 10);
const plant = new THREE.Group(); scene.add(plant);
const crown = new THREE.Group(); plant.add(crown);
const CROWN_TILT = 0.3;
crown.rotation.x = CROWN_TILT;

const greenMat = () => makeMat(1, 0.8);
const stemMat = greenMat();
const stemMesh = new THREE.Mesh(new THREE.BufferGeometry(), stemMat); plant.add(stemMesh);
const leafMatL = greenMat(), leafMatR = greenMat();
const leafL = new THREE.Mesh(new THREE.BufferGeometry(), leafMatL); plant.add(leafL);
const leafR = new THREE.Mesh(new THREE.BufferGeometry(), leafMatR); plant.add(leafR);
const recMesh = new THREE.Mesh(addAO(new THREE.SphereGeometry(0.075, 18, 12)), greenMat());
recMesh.scale.y = 0.8; crown.add(recMesh);

/* ---- çanak yapraklar ---- */
const SEP_N = 5, SNU = 10, SNV = 4;
const sepGeo = gridGeometry(SNU, SNV, SEP_N);
const sepMesh = new THREE.Mesh(sepGeo, greenMat()); crown.add(sepMesh);
function updateSepals(curl, appear) {
  const P = sepGeo.attributes.position.array, A = sepGeo.attributes.ao.array;
  let o = 0, oa = 0;
  const L = 0.36 * appear;
  for (let s = 0; s < SEP_N; s++) {
    const al = s * Math.PI * 2 / SEP_N + 0.35;
    const dx = Math.cos(al), dz = Math.sin(al), sx = -dz, sz = dx;
    let px = dx * 0.05 * appear, py = 0, pz = dz * 0.05 * appear;
    const ds = L / SNU;
    for (let i = 0; i <= SNU; i++) {
      const u = i / SNU;
      const e = lerp(0.12 - 0.3 * u, -0.45 - 1.9 * u * u, curl);
      const ce = Math.cos(e), se = Math.sin(e);
      // yerel "yukarı" (yaprak normaline yakın)
      const ux = -se * dx, uy = ce, uz = -se * dz;
      const hw = 0.11 * appear * Math.pow(1 - u, 1.15) * (0.45 + 0.55 * sstep(u / 0.25));
      for (let j = 0; j <= SNV; j++) {
        const v = -1 + 2 * j / SNV;
        const lift = -Math.abs(v) * hw * 0.35;
        P[o++] = px + sx * v * hw + ux * lift;
        P[o++] = py + uy * lift;
        P[o++] = pz + sz * v * hw + uz * lift;
        A[oa++] = lerp(0.6, 1, sstep(u / 0.4));
      }
      const em = lerp(0.12 - 0.3 * (u + 0.5 / SNU), -0.45 - 1.9 * Math.pow(u + 0.5 / SNU, 2), curl);
      px += Math.cos(em) * dx * ds; py += Math.sin(em) * ds; pz += Math.cos(em) * dz * ds;
    }
  }
  sepGeo.attributes.position.needsUpdate = true; sepGeo.attributes.ao.needsUpdate = true;
  sepGeo.computeVertexNormals();
  sepGeo.computeBoundingSphere();
}

/* ---- taç: önden görünen katmanlı elipsoid taç yaprakları (hücrelere doğrudan çizilir) ----
   birim: taç yüksekliği = 1, orijin = çanak merkezi. [cx, cy, rx, ry, dönüş]
   B = tomurcuk (tam şişmiş), O = tam açmış. Sıra: arkadan öne. */
const PETALS = [
  // B                          O                           ton  gecikme dalga  sarmal
  [[0, .32, .12, .18, 0],      [0, .76, .50, .22, 0],      .50, .15, .08, 0],   // arka kenar
  [[-.03, .30, .13, .20, .1],  [-.40, .70, .30, .20, .25], .60, .15, .07, 0],   // arka sol
  [[.03, .30, .13, .20, -.1],  [.40, .70, .30, .20, -.25], .60, .15, .07, 0],   // arka sağ
  [[-.02, .40, .09, .13, 0],   [-.04, .80, .16, .16, 0],   .80, .20, 0, 1],     // göbek 1
  [[.03, .36, .08, .12, 0],    [.07, .75, .14, .14, 0],    .85, .20, 0, 1],     // göbek 2
  [[-.06, .28, .12, .22, .15], [-.20, .58, .20, .30, .35], .90, .10, .05, 0],   // iç sol
  [[.07, .26, .11, .21, -.2],  [.22, .56, .20, .30, -.35], .90, .10, .05, 0],   // iç sağ
  [[-.08, .20, .11, .18, .25], [-.45, .48, .24, .44, .62], .85, 0, .05, 0],     // dış sol
  [[.09, .19, .10, .17, -.25], [.45, .48, .24, .44, -.62], .85, 0, .05, 0],     // dış sağ
  [[-.08, .30, 0, 0, 0],       [-.76, .77, .14, .08, .6],  1.1, .30, 0, 0],     // sol kıvrık uç
  [[.08, .30, 0, 0, 0],        [.76, .77, .14, .08, -.6],  1.1, .30, 0, 0],     // sağ kıvrık uç
  [[-.05, .20, 0, 0, 0],       [-.24, .38, .17, .27, .45],  .95, .05, .04, 0],   // ön sol
  [[.05, .20, 0, 0, 0],        [.24, .38, .17, .27, -.45],  .95, .05, .04, 0],   // ön sağ
  [[0, .14, .13, .14, 0],      [0, .30, .27, .32, 0],      1.0, 0, .04, 0],     // ön
  ];
const PN = PETALS.length, PCUR = new Float32Array(PN * 5);
const LX = -0.45, LY = 0.55, LZ = 0.70, LN = Math.hypot(LX, LY, LZ);
function setPetals(swell, bloomRaw) {          // swell: tomurcuk şişmesi, bloomRaw: doğrusal açılma
  const sx = swell, sy = swell * lerp(0.75, 1, swell);
  for (let k = 0; k < PN; k++) {
    const [B, O, , d] = PETALS[k];
    const q = easeIO((bloomRaw - d) / 0.7);
    const o = k * 5;
    PCUR[o] = lerp(B[0] * sx, O[0], q); PCUR[o + 1] = lerp(B[1] * sy, O[1], q);
    PCUR[o + 2] = lerp(B[2] * sx, O[2], q); PCUR[o + 3] = lerp(B[3] * sy, O[3], q);
    PCUR[o + 4] = lerp(B[4], O[4], q);
  }
}
// (x, y) taç biriminde → en öndeki taç yaprağı; ışık değeri PL'ye yazılır
let PL = 0;
function hitPetal(x, y) {
  for (let k = PN - 1; k >= 0; k--) {
    const o = k * 5, rx = PCUR[o + 2], ry = PCUR[o + 3];
    if (rx < 1e-3) continue;
    const dx = x - PCUR[o], dy = y - PCUR[o + 1], cr = Math.cos(PCUR[o + 4]), sr = Math.sin(PCUR[o + 4]);
    const lx = (dx * cr + dy * sr) / rx, ly = (-dx * sr + dy * cr) / ry;
    let r2 = lx * lx + ly * ly;
    if (r2 > 1.3) continue;
    const P = PETALS[k];
    if (P[4] && ly > 0) r2 /= Math.pow(1 + P[4] * Math.sin(Math.atan2(ly, lx) * 5 + k), 2);   // dalgalı kenar
    if (r2 >= 1) continue;
    const z = Math.sqrt(1 - r2);
    const nx = lx * 0.7, ny = ly * 0.7, nn = Math.hypot(nx, ny, z);
    const dif = Math.max(0, (nx * LX + ny * LY + z * LZ) / (nn * LN));
    let b = 0.85 * P[2] * (0.1 + 0.9 * dif) * (0.35 + 0.65 * z);
    if (P[5]) { const f = (Math.atan2(ly, lx) / 6.2832 + Math.sqrt(r2) * 1.6) % 1; if ((f + 1) % 1 < 0.14) b *= 0.35; }
    PL = b > 1 ? 1 : b;
    return k;
  }
  return -1;
}
const CROWN_BB = { x0: -0.85, x1: 0.85, y0: -0.1, y1: 1.0, w: 1.7, h: 1.1 };
const RHO = CROWN_BB.w / CROWN_BB.h;

/* ---- gövde ve yapraklar (yerleşime bağlı) ---- */
function buildStem(Ls, r, capH) {
  const pts = [];
  for (let i = 0; i <= 8; i++) {
    const a = -Math.PI / 2 + i / 8 * Math.PI / 2;
    pts.push(new THREE.Vector2(Math.max(1e-4, r * Math.cos(a)), capH * (1 + Math.sin(a))));
  }
  pts.push(new THREE.Vector2(r, Ls));
  return addAO(new THREE.LatheGeometry(pts, 28));
}
function buildLeaf(L, W, dir, up) {
  const nu = 18, nv = 8;
  const g = gridGeometry(nu, nv, 1);
  const P = g.attributes.position.array, A = g.attributes.ao.array;
  const ca = Math.cos(up), sa = Math.sin(up);
  let o = 0, oa = 0;
  for (let i = 0; i <= nu; i++) {
    const u = i / nu;
    const hw = Math.max(W * 0.05, W / 2 * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.78)), 0.8));
    const cx = dir * u * L * ca, cy = u * L * sa - 0.07 * L * u * u;
    for (let j = 0; j <= nv; j++) {
      const v = -1 + 2 * j / nv;
      P[o++] = cx - dir * sa * v * hw * 0.3;
      P[o++] = cy + v * hw;
      P[o++] = -Math.abs(v) * hw * 0.55 + 0.05 * v * hw;
      A[oa++] = lerp(0.7, 1, sstep(u / 0.3)) * lerp(0.92, 1, Math.abs(v));
    }
  }
  g.computeVertexNormals();
  const tip = new THREE.Vector3(dir * L * ca, L * sa - 0.07 * L, 0);
  return { g, tip };
}

/* ---------------------------------------------------------------
   Izgara, atlas, render hedefi, ekran geçişi
---------------------------------------------------------------- */
let dpr, devW, devH, cw, ch, cols, rows, offX, offY, NC;
let cellData, cellTex, atlasTex, rt, rtW, rtH, pix;
let cov, lum, ids, dep, roseG, roseC, births, prevCov;
let L = {};          // yerleşim
let leafTipL, leafTipR, thr8 = 3;
let primeFlash = true;

const screenMat = new THREE.ShaderMaterial({
  uniforms: {
    uCells: { value: null }, uAtlas: { value: null },
    uGrid: { value: new THREE.Vector2() }, uCell: { value: new THREE.Vector2() },
    uOff: { value: new THREE.Vector2() }, uH: { value: 1 }, uGlow: { value: 0.16 }
  },
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    precision highp float; precision highp int;
    uniform sampler2D uCells; uniform sampler2D uAtlas;
    uniform vec2 uGrid; uniform vec2 uCell; uniform vec2 uOff; uniform float uH; uniform float uGlow;
    void main(){
      vec2 p = vec2(gl_FragCoord.x - uOff.x, uH - gl_FragCoord.y - uOff.y);
      ivec2 c = ivec2(floor(p / uCell));
      ivec2 gr = ivec2(uGrid);
      vec3 col = vec3(0.0);
      if (c.x >= 0 && c.y >= 0 && c.x < gr.x && c.y < gr.y) {
        vec4 d = texelFetch(uCells, c, 0);
        int g = int(d.a * 255.0 + 0.5);
        if (g > 0) {
          ivec2 lp = ivec2(floor(p - vec2(c) * uCell));
          float a = texelFetch(uAtlas, ivec2(g * int(uCell.x) + lp.x, lp.y), 0).r;
          col = d.rgb * a;
        }
      }
      vec3 gs = vec3(0.0);
      for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
        ivec2 n = c + ivec2(i, j);
        if (n.x < 0 || n.y < 0 || n.x >= gr.x || n.y >= gr.y) continue;
        vec4 d = texelFetch(uCells, n, 0);
        if (d.a == 0.0) continue;
        vec2 dd = (p - (vec2(n) + 0.5) * uCell) / uCell.x;
        gs += d.rgb * d.rgb * exp(-dot(dd, dd) * 0.55);
      }
      col += gs * uGlow;
      gl_FragColor = vec4(col, 1.0);
    }`,
  depthTest: false, depthWrite: false
});
const screenScene = new THREE.Scene();
const screenQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), screenMat);
screenQuad.frustumCulled = false; screenScene.add(screenQuad);
const screenCam = new THREE.Camera();

function buildAtlas() {
  const n = 95, cv = document.createElement('canvas');
  cv.width = n * cw; cv.height = ch;
  const x = cv.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0, 0, cv.width, cv.height);
  const fam = 'Menlo, "SF Mono", ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace';
  let fs = ch * 0.95;
  x.font = `${fs}px ${fam}`;
  const mw = x.measureText('M').width;
  if (mw > cw * 1.02) fs *= cw * 1.02 / mw;
  x.font = `${fs}px ${fam}`;
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  for (let g = 1; g < n; g++) x.fillText(String.fromCharCode(32 + g), g * cw + cw / 2, ch * 0.54);
  if (atlasTex) atlasTex.dispose();
  atlasTex = new THREE.Texture(cv);
  atlasTex.flipY = false; atlasTex.generateMipmaps = false;
  atlasTex.minFilter = atlasTex.magFilter = THREE.NearestFilter;
  atlasTex.needsUpdate = true;
}

/* ---- metin DOM ---- */
const msgEl = document.getElementById('msg'), sigEl = document.getElementById('sig');
const txtEl = document.getElementById('txt'), hintEl = document.getElementById('hint');
hintEl.textContent = CONFIG.replayHint;
function makeSpans(el, str) {
  el.textContent = '';
  return [...str].map(chr => {
    const s = document.createElement('span');

  if (gR > 0.001 && t < TL.leafR[1] + 0.25) { tmpV.copy(leafTipR); leafR.localToWorld(tmpV); tips.push([...toCell(tmpV), 1 - sstep((t - TL.leafR[1]) / 0.25), 3]); }
  if (t > TL.sepal[0] && t < TL.bud[0] + 0.6) {
    tmpV.set(0, 0.03, 0); crown.localToWorld(tmpV);
    tips.push([...toCell(tmpV), Math.sin(Math.PI * clamp01((t - TL.sepal[0]) / (TL.bud[0] + 0.6 - TL.sepal[0]))), 4]);
  }
  if (t > TL.bud[0] + 0.3 && t < TL.bud[1]) {
    tmpV.set(0, 0.03 + 0.5 * gB, 0); crown.localToWorld(tmpV);
    tips.push([...toCell(tmpV), 0.6 * Math.sin(Math.PI * clamp01((t - TL.bud[0] - 0.3) / (TL.bud[1] - TL.bud[0] - 0.3))), 5]);
  }
  for (const [c, r, k, seed] of tips) if (k > 0.01) drawDust(c, r, k, t, seed);
  for (const [c, r, k, seed] of tips) if (k > 0.01 && seed < 5) drawTip(c, r, k, t, seed === 4);

  // yazı
  const writing = updateText(t);
  if (writing) drawTip(writing.cx, writing.cy, writing.k, t, true);
  hintEl.classList.toggle('show', t > HINT_T);

  cellTex.needsUpdate = true;
  renderer.setClearColor(0x000000, 1);
  renderer.render(screenScene, screenCam);
}

function updateText(t) {
  let writing = null;
  const step = (arr, start, gap, dur) => {
    arr.forEach((s, i) => {
      const s0 = start + i * gap;
      let st = t < s0 ? 0 : t < s0 + dur ? 1 : 2;
      if (s.space && st === 1) st = 2;
      if (st === 1) {
        s.el.textContent = SCRAMBLE[Math.floor(Math.random() * SCRAMBLE.length)];
        writing = { cx: s.cx, cy: s.cy, k: 0.9 };
      }
      if (st !== s.st) {
        s.st = st;
        s.el.className = st === 0 ? '' : st === 1 ? 'on scr' : 'on';
        if (st !== 1) s.el.textContent = s.ch;
      }
    });
  };
  step(msgSpans, TL.text, LETTER_GAP, LETTER_SCR);
  step(sigSpans, SIG_START, 0.08, 0.35);
  return writing;
}

/* ---------------------------------------------------------------
   Döngü, etkileşim
---------------------------------------------------------------- */
let T = 0, last = performance.now(), raf = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  T = FREEZE !== null ? FREEZE : T + dt;
  update(T, dt);
  raf = requestAnimationFrame(frame);
}
function start() { cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(frame); }
function restart() {
  if (FREEZE !== null) return;
  T = 0; sparkles = []; glitches = []; nextSpark = 0; lastSep = -1;
  births.fill(-9); prevCov.fill(0);
  for (const s of [...msgSpans, ...sigSpans]) { s.st = -1; }
  hintEl.classList.remove('show');
  initStars();
}
addEventListener('pointerdown', restart);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancelAnimationFrame(raf); else start();
});
let rzT = 0;
const onResize = () => { clearTimeout(rzT); rzT = setTimeout(() => { layout(); }, 120); };
addEventListener('resize', onResize);
addEventListener('orientationchange', onResize);

(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  layout();
  window.__rose = { RHO, CROWN_BB, get L() { return L; }, get grid() { return { cols, rows, cw, ch }; } };
  start();
});
</script>
